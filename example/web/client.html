<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时数字人系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            padding: 40px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        #remoteVideo {
            width: 100%;
            display: block;
            background: #1a1a1a;
            min-height: 400px;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff4444;
            color: white;
        }

        .btn-danger:hover {
            background: #ff6666;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 68, 68, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-panel {
            margin-top: 30px;
            padding: 20px;
            background: #f7f9fc;
            border-radius: 10px;
            display: none;
        }

        .info-panel.visible {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }

        .info-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 实时数字人系统</h1>
            <p>AI驱动的实时语音交互数字人</p>
        </div>

        <div class="main-content">
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="status-bar">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText">未连接</span>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在连接...</p>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">开始</button>
                <button id="stopBtn" class="btn btn-danger" disabled>停止</button>
            </div>

            <div class="info-panel" id="infoPanel">
                <h3>连接信息</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">延迟</div>
                        <div class="info-value" id="latency">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">帧率</div>
                        <div class="info-value" id="fps">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">分辨率</div>
                        <div class="info-value" id="resolution">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">音频</div>
                        <div class="info-value" id="audioStatus">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DiHumanClient {
            constructor() {
                this.pc = null;
                this.localStream = null;
                this.statsInterval = null;

                // 绑定元素
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.remoteVideo = document.getElementById('remoteVideo');
                this.statusText = document.getElementById('statusText');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.loading = document.getElementById('loading');
                this.infoPanel = document.getElementById('infoPanel');

                // 绑定事件
                this.startBtn.onclick = () => this.start();
                this.stopBtn.onclick = () => this.stop();
            }

            async start() {
                try {
                    this.showLoading(true);
                    this.updateStatus('正在获取麦克风权限...');

                    // 获取麦克风权限
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            sampleRate: 48000
                        },
                        video: false
                    });

                    this.updateStatus('正在建立连接...');

                    // 创建RTCPeerConnection
                    const configuration = {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    };

                    this.pc = new RTCPeerConnection(configuration);

                    // 添加本地音频轨道
                    this.localStream.getTracks().forEach(track => {
                        this.pc.addTrack(track, this.localStream);
                    });

                    // 处理远程流
                    this.pc.ontrack = (event) => {
                        if (event.streams && event.streams[0]) {
                            this.remoteVideo.srcObject = event.streams[0];
                        }
                    };

                    // 连接状态监听
                    this.pc.onconnectionstatechange = () => {
                        this.handleConnectionStateChange();
                    };

                    // 创建offer
                    const offer = await this.pc.createOffer();
                    await this.pc.setLocalDescription(offer);

                    // 发送offer到服务器
                    const response = await fetch('/offer', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            sdp: offer.sdp,
                            type: offer.type
                        })
                    });

                    const answer = await response.json();
                    await this.pc.setRemoteDescription(answer);

                    // 更新UI
                    this.startBtn.disabled = true;
                    this.stopBtn.disabled = false;

                    // 开始统计
                    this.startStats();

                } catch (error) {
                    console.error('启动失败:', error);
                    this.updateStatus('连接失败: ' + error.message);
                    this.showLoading(false);
                }
            }

            stop() {
                // 停止统计
                if (this.statsInterval) {
                    clearInterval(this.statsInterval);
                    this.statsInterval = null;
                }

                // 关闭连接
                if (this.pc) {
                    this.pc.close();
                    this.pc = null;
                }

                // 停止本地流
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                    this.localStream = null;
                }

                // 清除视频
                this.remoteVideo.srcObject = null;

                // 更新UI
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.updateStatus('未连接');
                this.statusIndicator.classList.remove('connected');
                this.infoPanel.classList.remove('visible');
            }

            handleConnectionStateChange() {
                const state = this.pc.connectionState;

                switch(state) {
                    case 'connected':
                        this.updateStatus('已连接');
                        this.statusIndicator.classList.add('connected');
                        this.showLoading(false);
                        this.infoPanel.classList.add('visible');
                        break;
                    case 'disconnected':
                        this.updateStatus('连接断开');
                        this.statusIndicator.classList.remove('connected');
                        break;
                    case 'failed':
                        this.updateStatus('连接失败');
                        this.statusIndicator.classList.remove('connected');
                        this.stop();
                        break;
                    case 'connecting':
                        this.updateStatus('连接中...');
                        break;
                }
            }

            updateStatus(text) {
                this.statusText.textContent = text;
            }

            showLoading(show) {
                if (show) {
                    this.loading.classList.add('visible');
                } else {
                    this.loading.classList.remove('visible');
                }
            }

            async startStats() {
                this.statsInterval = setInterval(async () => {
                    if (!this.pc) return;

                    const stats = await this.pc.getStats();
                    let videoWidth = 0, videoHeight = 0;
                    let fps = 0;
                    let audioActive = false;

                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.kind === 'video') {
                            videoWidth = report.frameWidth || 0;
                            videoHeight = report.frameHeight || 0;
                            fps = report.framesPerSecond || 0;
                        }
                        if (report.type === 'inbound-rtp' && report.kind === 'audio') {
                            audioActive = true;
                        }
                    });

                    // 更新显示
                    document.getElementById('fps').textContent = fps ? `${Math.round(fps)} FPS` : '--';
                    document.getElementById('resolution').textContent =
                        (videoWidth && videoHeight) ? `${videoWidth}×${videoHeight}` : '--';
                    document.getElementById('audioStatus').textContent = audioActive ? '正常' : '无音频';

                    // 简单的延迟估算
                    const now = Date.now();
                    if (this.pc.getRemoteStreams && this.pc.getRemoteStreams()[0]) {
                        const videoTrack = this.pc.getRemoteStreams()[0].getVideoTracks()[0];
                        if (videoTrack) {
                            // 这里可以添加更精确的延迟测量
                            document.getElementById('latency').textContent = '<100ms';
                        }
                    }
                }, 1000);
            }
        }

        // 初始化客户端
        const client = new DiHumanClient();
    </script>
</body>
</html>
